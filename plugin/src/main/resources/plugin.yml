name: PetalAntiFreecam
version: '${version}'

main: com.boggy.petalantifreecam.PetalAntiFreecam
api-version: '1.21.11'
load: POSTWORLD
folia-supported: true
canvas-supported: true

commands:
  antifreecam:
    description: Reloads the PetalAntiFreecam config
    usage: /antifreecam reload
    permission: petalantifreecam.reload

permissions:
  petalantifreecam.reload:
    description: Allows reloading PetalAntiFreecam
    default: op
